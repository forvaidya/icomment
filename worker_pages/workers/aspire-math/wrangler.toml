name = "aspire-math"
main = "src/index.ts"
compatibility_date = "2026-08-30"
workers_dev = false
account_id = "fd13bf6b366f66d013202fb0188b9840"

[ai]
binding = "AI"

# TODO: Create D1 database via Cloudflare dashboard
# Then uncomment and add real database_id
# [[d1_databases]]
# binding = "DB"
# database_name = "aspire-recipe-db"
# database_id = "<actual-database-id-uuid>"

# KV cache namespace — optional, skipped if not configured
# To enable: create namespace with `wrangler kv:namespace create aspire-recipe-cache`
# Then uncomment below and add the namespace id
# [[kv_namespaces]]
# binding = "RECIPE_CACHE"
# id = "your-namespace-id"

[[mtls_certificates]]
binding = "LAPTOP_BACKEND_MTLS"
certificate_id = "56964753-03ed-4f3e-89b3-89873425d0ed"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
