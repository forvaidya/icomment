name = "aspire-math"
main = "src/index.ts"
compatibility_date = "2026-08-30"
workers_dev = false
account_id = "fd13bf6b366f66d013202fb0188b9840"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "aspire-recipe-db"
database_id = "73ff4eb1-e05d-43e6-82a4-42f6a85b9abe"

# KV cache namespace — optional, skipped if not configured
# To enable: create namespace with `wrangler kv:namespace create aspire-recipe-cache`
# Then uncomment below and add the namespace id
# [[kv_namespaces]]
# binding = "RECIPE_CACHE"
# id = "your-namespace-id"

[[mtls_certificates]]
binding = "LAPTOP_BACKEND_MTLS"
certificate_id = "56964753-03ed-4f3e-89b3-89873425d0ed"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
