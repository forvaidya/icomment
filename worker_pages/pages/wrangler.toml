name = "aspire-pages"
compatibility_date = "2026-08-30"
pages_build_output_dir = "."

# Keep production deploys explicit: use `npm run deploy` from a clean `main`
# checkout. Omitting `--branch` makes Wrangler create the production deploy.

[[mtls_certificates]]
binding = "LAPTOP_BACKEND_MTLS"
certificate_id = "56964753-03ed-4f3e-89b3-89873425d0ed"

[[services]]
binding = "ASPIRE_MATH"
service = "aspire-math"
