<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍲 Recipe Agent</title>
    <link rel="stylesheet" href="/css/recipe-agent.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }

        nav {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <nav>
        <a class="nav-link" href="/">← Back to Home</a>
    </nav>

    <div class="recipe-container">
        <div class="recipe-card">
            <h1 class="recipe-title">🍲 Recipe Agent</h1>

            <div class="form-group">
                <label class="form-label" for="query">What would you like to cook?</label>
                <textarea class="form-textarea" id="query" rows="3" placeholder="What would you like to cook?"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Diet</label>
                <div class="checkbox-grid">
                    <div class="checkbox-option">
                        <input type="checkbox" id="veg" name="diet" value="veg" checked>
                        <label for="veg">Veg</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="non_veg" name="diet" value="non_veg">
                        <label for="non_veg">Non-Veg</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="vegan" name="diet" value="vegan">
                        <label for="vegan">Vegan</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Allergies</label>
                <div class="checkbox-grid">
                    <div class="checkbox-option">
                        <input type="checkbox" id="peanuts" name="allergies" value="peanuts">
                        <label for="peanuts">Peanuts</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="tree_nuts" name="allergies" value="tree_nuts">
                        <label for="tree_nuts">Tree Nuts</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="dairy" name="allergies" value="dairy">
                        <label for="dairy">Dairy</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="shellfish" name="allergies" value="shellfish">
                        <label for="shellfish">Shellfish</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="eggs" name="allergies" value="eggs">
                        <label for="eggs">Eggs</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="wheat" name="allergies" value="wheat">
                        <label for="wheat">Wheat/Gluten</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="soy" name="allergies" value="soy">
                        <label for="soy">Soy</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="sesame" name="allergies" value="sesame">
                        <label for="sesame">Sesame</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="fish" name="allergies" value="fish">
                        <label for="fish">Fish</label>
                    </div>
                </div>
            </div>

            <button class="submit-button" id="generateBtn">Generate Recipe</button>
            <div class="result-box" id="result"></div>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const resultDiv = document.getElementById('result');

        generateBtn.addEventListener('click', async () => {
            const query = document.getElementById('query').value;
            const diet = Array.from(document.querySelectorAll('input[name="diet"]:checked'))
                .map(cb => cb.value);
            const allergies = Array.from(document.querySelectorAll('input[name="allergies"]:checked'))
                .map(cb => cb.value);

            // Show loading state
            resultDiv.textContent = 'Generating...';
            resultDiv.classList.add('result-loading');
            generateBtn.disabled = true;

            try {
                const response = await fetch('/api/meal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query, diet, allergies })
                });

                const data = await response.json();

                if (!response.ok) {
                    resultDiv.textContent = `Error: ${data.error || 'Unknown error'}`;
                    resultDiv.classList.remove('result-loading');
                    resultDiv.classList.add('result-error');
                } else {
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                    resultDiv.classList.remove('result-loading', 'result-error');
                }
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.classList.remove('result-loading');
                resultDiv.classList.add('result-error');
            } finally {
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
