<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="version" content="20ef554">
  <title>Aspire System</title>
  <style>
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    main {
      width: min(90vw, 28rem);
      padding: 2rem;
      text-align: center;
      background: #fff;
      border: 1px solid #dce3ee;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgb(23 32 51 / 10%);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
    }

    .calculator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    input {
      width: 3ch;
      padding: 0.55rem 0.4rem;
      border: 1px solid #aebbd0;
      border-radius: 4px;
      font: inherit;
      text-align: center;
    }

    button {
      padding: 0.55rem 0.8rem;
      border: 0;
      border-radius: 4px;
      background: #1769aa;
      color: #fff;
      cursor: pointer;
      font: inherit;
    }

    button[type="button"] {
      background: #667085;
    }

    #message {
      min-height: 1.5rem;
      margin: 1.5rem 0 0;
      font-weight: 600;
    }

    .error {
      color: #b42318;
    }

    .result {
      color: #087443;
    }

    .section {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #dce3ee;
    }

    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    .add .section-title {
      color: #1769aa;
    }

    .multiply .section-title {
      color: #b42318;
    }

    .red-marker {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #b42318;
      border-radius: 50%;
      margin-right: 0.5rem;
    }

    footer {
      position: fixed;
      bottom: 0.5rem;
      right: 0.5rem;
      font-size: 0.75rem;
      color: #aebbd0;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Aspire System</h1>

    <div class="section add">
      <div class="section-title">Add Operation</div>
      <form class="calculator" id="add-form">
        <input id="add-first" name="a" type="text" inputmode="decimal" aria-label="First number">
        <span>+</span>
        <input id="add-second" name="b" type="text" inputmode="decimal" aria-label="Second number">
        <button type="submit">Add</button>
        <button type="button" class="clear-btn">Clear</button>
      </form>
      <p id="add-message" role="status" aria-live="polite"></p>
    </div>

    <div class="section multiply">
      <div class="section-title"><span class="red-marker"></span>Multiply Operation</div>
      <form class="calculator" id="multiply-form">
        <input id="multiply-first" name="a" type="text" inputmode="decimal" aria-label="First number">
        <span>×</span>
        <input id="multiply-second" name="b" type="text" inputmode="decimal" aria-label="Second number">
        <button type="submit">Multiply</button>
        <button type="button" class="clear-btn">Clear</button>
      </form>
      <p id="multiply-message" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script>
    function initCalculator(formId, endpoint) {
      const form = document.querySelector(`#${formId}`);
      const firstInput = form.querySelector('input[name="a"]');
      const secondInput = form.querySelector('input[name="b"]');
      const messageEl = form.parentElement.querySelector('[role="status"]');
      const clearBtns = form.querySelectorAll('.clear-btn');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        messageEl.className = '';
        messageEl.textContent = 'Calculating...';

        const params = new URLSearchParams({ a: firstInput.value, b: secondInput.value });
        const response = await fetch(`/api/${endpoint}?${params}`);
        const data = await response.json();

        if (!response.ok) {
          messageEl.className = 'error';
          messageEl.textContent = data.error || 'Unable to calculate';
          return;
        }

        messageEl.className = 'result';
        messageEl.textContent = `Result: ${data.result}`;
      });

      clearBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          form.reset();
          messageEl.className = '';
          messageEl.textContent = '';
          firstInput.focus();
        });
      });
    }

    initCalculator('add-form', 'add');
    initCalculator('multiply-form', 'multiply');
  </script>
  <footer>v:c27bf27</footer>
</body>
</html>
