<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="version" content="{{SHA1}}">
    <title>{{{ title }}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #app {
            flex: 1;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        nav a {
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .nav-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-controls label {
            font-size: 12px;
            color: #666;
        }

        .nav-controls select {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            background: white;
            cursor: pointer;
        }

        footer {
            border-top: 1px solid #ddd;
            padding: 20px;
            background: white;
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: auto;
            flex-shrink: 0;
        }

        footer p {
            margin: 4px 0;
        }
    </style>
    {{{ head }}}
</head>
<body>
    <div id="app">
        <nav>
            <a href="/">← Back to Home</a>
            <div class="nav-controls">
                <label for="logLevel">Debug Level:</label>
                <select id="logLevel">
                    <option value="error">Error</option>
                    <option value="info">Info</option>
                    <option value="debug" selected>Debug</option>
                </select>
            </div>
        </nav>

        {{{ body }}}
    </div>

    <footer>
        <p>🍲 icomment | Powered by Cloudflare Workers + Pages</p>
        <p style="margin-top: 8px; font-size: 11px;">© 2026 icomment. <span id="version-info"></span></p>
    </footer>

    <script>
        // Log level persistence
        const logLevelSelect = document.getElementById('logLevel');
        const logLevelKey = 'recipeLogLevel';

        function getLogLevel() {
            return localStorage.getItem(logLevelKey) || 'debug';
        }

        function setLogLevel(level) {
            localStorage.setItem(logLevelKey, level);
        }

        logLevelSelect.value = getLogLevel();
        logLevelSelect.addEventListener('change', (e) => setLogLevel(e.target.value));

        // Deployment info footer
        document.addEventListener('DOMContentLoaded', async () => {
            const versionMeta = document.querySelector('meta[name="version"]');
            const versionInfo = document.getElementById('version-info');
            if (versionInfo) {
                let info = '';
                if (versionMeta) info += `SHA1: ${versionMeta.content}`;

                try {
                    const res = await fetch('/api/deployment-info');
                    if (res.ok) {
                        const data = await res.json();
                        if (info) info += ' | ';
                        info += `Worker: ${data.sha1}`;
                    }
                } catch (e) {
                    console.log('Could not fetch deployment info');
                }
                versionInfo.textContent = info;
            }
        });
    </script>
    {{{ scripts }}}
</body>
</html>
