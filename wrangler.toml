name = "psychomments"
main = "src/index.ts"
compatibility_date = "2024-12-11"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "psychomments"
database_id = "b2d29544-bcf4-4d16-bd19-0b169a4d9405"

# KV Namespace Binding for Admin List
[[kv_namespaces]]
binding = "KV_ADMIN"
id = "42aac3233a734f66835313dd75ed887c"
preview_id = "42aac3233a734f66835313dd75ed887c"

# R2 Bucket Binding for Profile Images
[[r2_buckets]]
binding = "R2_PROFILES"
bucket_name = "psychomments-profiles"

# Durable Object Binding for Real-Time Chat
[[durable_objects.bindings]]
name = "CHAT"
class_name = "GlobalChat"

# Durable Object Migration
[[migrations]]
tag = "v3"
new_sqlite_classes = ["GlobalChat"]

# CF Access Configuration
# The JWT from CF Access is passed in the Cf-Access-Jwt-Assertion header.
# Email whitelisting and access policies must be configured manually in Cloudflare Dashboard.
