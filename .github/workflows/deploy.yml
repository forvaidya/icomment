name: Deploy Worker & Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd worker_pages/workers/aspire-math && npm install

      - name: Deploy Worker with SHA1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SHA1=$(git rev-parse HEAD | cut -c1-8)
          export DEPLOYMENT_SHA="$SHA1"
          cd worker_pages/workers/aspire-math
          npx wrangler deploy

