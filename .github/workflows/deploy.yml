name: Deploy Worker & Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate HTML from templates with SHA1 and timestamp
        run: |
          SHA1=$(git rev-parse HEAD | cut -c1-8)
          DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cd worker_pages/pages
          sed -e "s/{{SHA1}}/$SHA1/g" -e "s/{{DEPLOYED_AT}}/$DEPLOYED_AT/g" index.html.template > index.html
          sed -e "s/{{SHA1}}/$SHA1/g" -e "s/{{DEPLOYED_AT}}/$DEPLOYED_AT/g" recipe-agent.html.template > recipe-agent.html
          echo "Generated files with SHA1: $SHA1, Deployed at: $DEPLOYED_AT"

      - name: Verify SHA1 and timestamp injection
        run: |
          SHA1=$(git rev-parse HEAD | cut -c1-8)
          cd worker_pages/pages
          echo "Verifying injection..."
          grep -q "version.*$SHA1" index.html && echo "✓ index.html: SHA1 $SHA1 found"
          grep -q "version.*$SHA1" recipe-agent.html && echo "✓ recipe-agent.html: SHA1 $SHA1 found"
          grep -q "deployed-at" index.html && echo "✓ index.html: deployment timestamp found"
          grep -q "deployed-at" recipe-agent.html && echo "✓ recipe-agent.html: deployment timestamp found"

      - name: Install dependencies
        run: cd worker_pages/workers/aspire-math && npm install

      - name: Commit and push generated HTML for Pages deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd worker_pages/pages
          git add -f index.html recipe-agent.html
          git commit -m "chore: regenerate HTML with SHA1 $(git rev-parse HEAD | cut -c1-8) [skip ci]" || echo "No changes to commit"
          git push

      - name: Deploy Worker with SHA1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SHA1=$(git rev-parse HEAD | cut -c1-8)
          export DEPLOYMENT_SHA="$SHA1"
          cd worker_pages/workers/aspire-math
          npx wrangler deploy

