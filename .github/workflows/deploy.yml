name: Deploy Worker & Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Extract SHA1
        id: sha
        run: echo "sha1=$(git rev-parse HEAD | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Generate HTML from templates
        run: |
          SHA1=${{ steps.sha.outputs.sha1 }}
          cd worker_pages/pages
          sed -e "s/{{SHA1}}/$SHA1/g" index.html.template > index.html
          sed -e "s/{{SHA1}}/$SHA1/g" recipe-agent.html.template > recipe-agent.html
          echo "✓ Generated with SHA1: $SHA1"

      - name: Install Worker dependencies
        run: cd worker_pages/workers/aspire-math && npm install

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_SHA: ${{ steps.sha.outputs.sha1 }}
        run: cd worker_pages/workers/aspire-math && npx wrangler deploy

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cd worker_pages/pages && npx wrangler pages deploy --project-name=aspire-pages

