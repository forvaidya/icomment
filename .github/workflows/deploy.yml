name: Deploy Worker & Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.1
        with:
          node-version: '22'

      - name: Generate HTML from templates with SHA1
        run: |
          SHA1=$(git rev-parse HEAD | cut -c1-8)
          cd worker_pages/pages
          sed "s/{{SHA1}}/$SHA1/g" index.html.template > index.html
          sed "s/{{SHA1}}/$SHA1/g" recipe-agent.html.template > recipe-agent.html
          echo "Generated files with SHA1: $SHA1"

      - name: Verify SHA1 injection
        run: |
          SHA1=$(git rev-parse HEAD | cut -c1-8)
          cd worker_pages/pages
          echo "Verifying SHA1 injection..."
          grep -q "version.*$SHA1" index.html && echo "✓ index.html: SHA1 $SHA1 found"
          grep -q "version.*$SHA1" recipe-agent.html && echo "✓ recipe-agent.html: SHA1 $SHA1 found"

      - name: Install dependencies
        run: cd worker_pages/workers/aspire-math && npm install

      - name: Deploy Worker
        run: cd worker_pages/workers/aspire-math && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

